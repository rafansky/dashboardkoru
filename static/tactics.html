<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0f" />
    <title>Pizarra tactica | KORU eClub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/tactics/styles.css" />
  </head>
  <body>
    <main class="tactics-app" id="tactics-app">
      <header class="editor-header">
        <div class="header-start">
          <a class="icon-button" href="/" aria-label="Volver al dashboard" title="Volver al dashboard">
            <i data-lucide="arrow-left"></i>
          </a>
          <img src="/assets/koru-mark.svg" alt="KORU" class="editor-mark" />
          <div class="editor-identity">
            <span>Pizarra tactica</span>
            <input id="board-name" maxlength="120" value="Nueva pizarra" aria-label="Nombre de la pizarra" />
          </div>
        </div>

        <div class="header-center" role="toolbar" aria-label="Vista del editor">
          <button class="icon-button" data-toggle-panel="left" type="button" aria-label="Mostrar u ocultar plantilla" title="Plantilla">
            <i data-lucide="panel-left"></i>
          </button>
          <div class="segmented compact">
            <button class="active" type="button" aria-pressed="true">2D</button>
            <button type="button" disabled title="Disponible en la fase 3D">3D</button>
          </div>
          <button class="icon-button" id="fit-pitch" type="button" aria-label="Encajar campo" title="Encajar campo">
            <i data-lucide="maximize"></i>
          </button>
          <button class="icon-button" id="fullscreen-button" type="button" aria-label="Pantalla completa" title="Pantalla completa">
            <i data-lucide="expand"></i>
          </button>
          <button class="icon-button" data-toggle-panel="right" type="button" aria-label="Mostrar u ocultar propiedades" title="Propiedades">
            <i data-lucide="panel-right"></i>
          </button>
        </div>

        <div class="header-actions">
          <span class="save-state" id="save-state">Sin guardar</span>
          <button class="icon-button" id="undo-button" type="button" disabled aria-label="Deshacer" title="Deshacer">
            <i data-lucide="undo-2"></i>
          </button>
          <button class="icon-button" id="redo-button" type="button" disabled aria-label="Rehacer" title="Rehacer">
            <i data-lucide="redo-2"></i>
          </button>
          <button class="primary-button" id="save-button" type="button">
            <i data-lucide="save"></i><span>Guardar</span>
          </button>
        </div>
      </header>

      <section class="editor-workspace">
        <aside class="side-panel roster-panel" id="roster-panel">
          <div class="panel-heading">
            <div><span>Plantilla</span><strong>Mi equipo</strong></div>
            <button class="icon-button small" data-collapse="left" type="button" aria-label="Ocultar plantilla" title="Ocultar panel">
              <i data-lucide="panel-left-close"></i>
            </button>
          </div>
          <label class="search-field">
            <i data-lucide="search"></i>
            <input id="roster-search" type="search" placeholder="Buscar jugador" aria-label="Buscar jugador" />
          </label>
          <div class="team-switch segmented" id="team-switch">
            <button class="active" type="button" data-team="home">KORU</button>
            <button type="button" data-team="away">Rival</button>
          </div>
          <div class="roster-list" id="roster-list"></div>
          <div class="library-divider"></div>
          <div class="panel-heading library-heading">
            <div><span>Documentos</span><strong>Biblioteca</strong></div>
            <button class="icon-button small" id="new-board-button" type="button" aria-label="Nueva pizarra" title="Nueva pizarra">
              <i data-lucide="plus"></i>
            </button>
          </div>
          <div class="board-list" id="board-list"></div>
        </aside>

        <section class="editor-stage">
          <nav class="tool-rail" aria-label="Herramientas disponibles">
            <button class="active" type="button" aria-label="Seleccion" title="Seleccion (V)"><i data-lucide="mouse-pointer-2"></i></button>
            <button type="button" aria-label="Mano" title="Mano (H)"><i data-lucide="hand"></i></button>
            <span></span>
            <button type="button" disabled aria-label="Flechas disponibles en fase 3" title="Disponible en fase 3"><i data-lucide="move-up-right"></i></button>
            <button type="button" disabled aria-label="Zonas disponibles en fase 3" title="Disponible en fase 3"><i data-lucide="square-dashed"></i></button>
            <button type="button" disabled aria-label="Texto disponible en fase 3" title="Disponible en fase 3"><i data-lucide="type"></i></button>
          </nav>

          <div class="pitch-viewport" id="pitch-viewport">
            <div class="pitch-shell" id="pitch-shell"></div>
            <div class="stage-hud">
              <span id="pitch-readout">105 × 68 m</span>
              <span>Zoom 100%</span>
            </div>
          </div>
        </section>

        <aside class="side-panel properties-panel" id="properties-panel">
          <div class="panel-heading">
            <button class="icon-button small" data-collapse="right" type="button" aria-label="Ocultar propiedades" title="Ocultar panel">
              <i data-lucide="panel-right-close"></i>
            </button>
            <div><span>Documento</span><strong>Propiedades</strong></div>
          </div>

          <div class="property-section">
            <label>Categoria
              <select id="board-category">
                <option>Ataque</option><option>Defensa</option><option>Transicion</option><option>Presion</option>
                <option>Salida de balon</option><option>Finalizacion</option><option>Corner</option><option>Falta</option>
                <option>Saque de banda</option><option>Entrenamiento</option><option>Analisis rival</option>
              </select>
            </label>
            <label>Descripcion
              <textarea id="board-description" rows="3" maxlength="2000" placeholder="Objetivo de la sesion..."></textarea>
            </label>
          </div>

          <div class="property-section">
            <div class="section-title"><strong>Campo</strong><span>Metros reales</span></div>
            <label>Vista
              <select id="pitch-view">
                <option value="full">Campo completo</option><option value="half">Medio campo</option>
                <option value="attacking-third">Tercio ofensivo</option><option value="defensive-third">Tercio defensivo</option>
                <option value="penalty-area">Area</option><option value="corner">Corner</option>
              </select>
            </label>
            <label>Orientacion
              <select id="pitch-orientation">
                <option value="left-to-right">Izquierda → derecha</option><option value="right-to-left">Derecha → izquierda</option>
                <option value="top-to-bottom">Arriba → abajo</option><option value="bottom-to-top">Abajo → arriba</option>
              </select>
            </label>
            <label>Cesped
              <select id="pitch-surface"><option value="stripes">Franjas</option><option value="plain">Liso</option></select>
            </label>
          </div>

          <div class="property-section">
            <div class="section-title"><strong>Analisis</strong><span>Overlays</span></div>
            <label class="toggle-row"><input type="checkbox" value="thirds" data-overlay /><span>Tercios</span></label>
            <label class="toggle-row"><input type="checkbox" value="five-lanes" data-overlay /><span>Cinco carriles</span></label>
            <label class="toggle-row"><input type="checkbox" value="grid" data-overlay /><span>Cuadricula</span></label>
          </div>
        </aside>
      </section>

      <footer class="timeline-panel">
        <div class="playback-controls">
          <button class="icon-button small" type="button" disabled aria-label="Ir al inicio"><i data-lucide="skip-back"></i></button>
          <button class="play-button" type="button" disabled aria-label="Reproducir"><i data-lucide="play"></i></button>
          <span>00:00.0</span>
        </div>
        <div class="scene-strip">
          <article class="scene-card active"><span>01</span><div><strong>Escena base</strong><small>Estado inicial</small></div></article>
        </div>
        <div class="timeline-meta"><span>Escenas</span><strong>1</strong></div>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script type="module" src="/static/tactics/app.js"></script>
  </body>
</html>
